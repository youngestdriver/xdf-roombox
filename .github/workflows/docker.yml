name: Docker image

# 推 main 且改动了 server/ 时构建并推送镜像；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '额外推送的镜像版本 tag（可选，如 1.0.1）'
        required: false

permissions:
  contents: read

env:
  IMAGE: papercranewillfly/xdf-roombox

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 检查 DOCKERHUB_TOKEN 是否已配置
        id: chk
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::warning::仓库未配置 DOCKERHUB_TOKEN secret，跳过镜像构建与推送"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成镜像标签
        id: tags
        if: steps.chk.outputs.skip != 'true'
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
            if [ -n "${{ inputs.tag }}" ]; then echo "$IMAGE:${{ inputs.tag }}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.chk.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          username: papercranewillfly
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.chk.outputs.skip != 'true'
        with:
          context: server
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
