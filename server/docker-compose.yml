services:
  xdf-api:
    build: .
    container_name: xdf-api
    ports:
      - "8080:8080"
    environment:
      - ADMIN_PASS=change-me          # 必填: 访问本服务的密码
      # - PORT=8080                   # 可选
      # - DATA_DIR=/data              # 可选
    volumes:
      - ./data:/data                  # SQLite 数据持久化
    restart: unless-stopped
